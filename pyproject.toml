[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.0.1"
description = "Atlas — Agent orchestration platform (Harness / Graph / Loop)"
requires-python = ">=3.11"
dependencies = [
    # AI engine (10 doc §2; ADR: LangChain + LangGraph core)
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    # T1: model gateway — provider/key switched via .env, no vendor lock-in
    "litellm>=1.100,<2",
    # Demo API + Harness gateway interface (T5: Python/FastAPI in Demo, Go later)
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13,<3",
    # Generic HTTP API adapter (04 §4.6; ADR T9 in 10 doc §4)
    "httpx>=0.28,<0.29",
    # Web adapter (W3-W4)
    "playwright>=1.62",
    # Memory layers: short-term Redis, long-term PostgreSQL + pgvector (06 §6.3)
    "redis>=8.1,<9",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "pgvector>=0.5",
    # Secret envelope encryption (docs/32 §2, ADR T26=a): AES-256-GCM master key
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires external services (PostgreSQL/Redis); opt-in via ATLAS_RUN_INTEGRATION=1",
]
