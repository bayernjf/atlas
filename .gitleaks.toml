title = "atlas gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and sample plugins that contain obviously-fake secret strings"
paths = [
  '''(.*/)?\.github/.*''',
  '''(.*/)?tests/.*''',
  '''(.*/)?fixtures/.*''',
  '''(.*/)?.*\.test\.py$''',
  '''(.*/)?.*\.sqlite$''',
  '''(.*/)?\.env\.example$''',
]
# 公开的口令生成字符集常量（非密钥，generic-api-key 据熵值误报）；
# 一条匹配声明行，一条匹配该固定公开字符集值本身
regexes = [
  '''GENERATED_PASSWORD_ALPHABET\s*=''',
  '''abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789''',
]
