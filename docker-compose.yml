# Atlas Demo 一键启动（持久化交付形态：pgvector + 命名卷，docs/30 ADR T24）。
# 启动：docker compose up --build
#   编辑器    http://localhost:8000
#   模拟商家控制台  http://localhost:8000/demo/shop（demo/demo）
# 重置本租户 Demo 数据（不删库，恢复 5 笔种子退款单）：
#   curl -X POST http://localhost:8000/api/demo/reset
# 数据持久化在 atlas-pgdata 卷；备份/恢复见 scripts/ops/backup.sh、restore.sh。
# 接真实 LLM：在 .env 配 LITELLM_MODEL + OPENAI_API_KEY + OPENAI_BASE_URL（见 .env.example）。
#
# TLS 反代（可选，docs/34 P1 / deploy/README.md）：
#   docker compose --profile edge up -d --build
# 起 Caddy（deploy/Caddyfile，填域名后自动 HTTPS）；生产请把下方 atlas 的
# "8000:8000" 改为 "127.0.0.1:8000:8000"，只让 Caddy 暴露 80/443。

# 可观测栈（可选，docs/35 §5 / D11 Grafana 子集）：
#   docker compose --profile observability up -d --build
# Prometheus http://localhost:9090（抓 atlas:8000/metrics，15s）；
# Grafana    http://localhost:3000（admin / GRAFANA_ADMIN_PASSWORD，默认 atlasadmin，生产必改）；
# 数据源与 Atlas Overview 看板自动装配（deploy/grafana/）。可与 edge profile 叠加。

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  atlas:
    build:
      context: .
    image: atlas-demo:latest
    # 单副本是硬约束，不是性能调优：第二个进程启动时会为第一个进程仍持有的挂起审批帧
    # 重建 pending 并各自续跑，下游真实副作用被执行两遍（docs/34 的 2026-09-25 实测表）。
    # 今天多副本还会先因 "8000:8000" 端口冲突起不来——那是巧合保护，不能当设计依赖，故显式钉住；
    # 入口脚本另对 ATLAS_WORKERS>1 与命令行 --workers>1 fail-closed（docs/62 §4）。
    deploy:
      replicas: 1
    ports:
      - "8000:8000"
    environment:
      ATLAS_STORAGE_BACKEND: pg
      DATABASE_URL: postgresql+psycopg://atlas:atlas@db:5432/atlas
      LITELLM_MODEL: ${LITELLM_MODEL:-}
      # 直连 OpenAI 兼容端点：litellm 读的是 OPENAI_API_KEY / OPENAI_BASE_URL，
      # 不是 LITELLM_API_KEY / LITELLM_BASE_URL（.env.example 已按源码更正）。
      # 两者缺任一个，LITELLM_MODEL 配了也发不出真实调用（docs/73 §1.1 W1）。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # 邮件真实投递（docs/73 §1.3）：`message/send` 在 channel=email 时按这组变量真发信，
      # HOST 留空＝回退进程内记录（demo 语义，与 `SmtpConfig.from_env()` 一致）。
      # 2026-10-05 打包 AZ 之前 compose **不透传这组**——宿主 .env 配了 SMTP，出厂容器里
      # 读到的仍是空 HOST，所以 1.3 的判据卡在部署层而不是供应商。由 U1157 机检：
      # 代码新增 ATLAS_SMTP_* 而 compose 没跟着透传 ⇒ 红。
      # 值一律由 vault／部署环境注入，绝不要把真凭据写进仓库里的 .env。
      ATLAS_SMTP_HOST: ${ATLAS_SMTP_HOST:-}
      ATLAS_SMTP_PORT: ${ATLAS_SMTP_PORT:-587}
      ATLAS_SMTP_USERNAME: ${ATLAS_SMTP_USERNAME:-}
      ATLAS_SMTP_PASSWORD: ${ATLAS_SMTP_PASSWORD:-}
      ATLAS_SMTP_FROM: ${ATLAS_SMTP_FROM:-}
      ATLAS_SMTP_USE_TLS: ${ATLAS_SMTP_USE_TLS:-true}
      # ---- 部署面变量总账（2026-10-05 打包 BA）：src/atlas 读到的每个部署变量都必须
      # 「进得了容器」或在 U1158 的豁免表上有具名理由——SMTP 那次缺口的根因是
      # 「代码读 env、compose 忘了透传」这件事没有任何机检。缺省保持代码语义
      # （空＝用代码自己的默认），仅 ATLAS_LLM_TIMEOUT_SECONDS／ATLAS_FRONTEND_DIST
      # 按代码默认显式给值（前者 float("") 会崩，后者空串会让前端静态目录解析成空路径）。
      # 唯一豁免＝ATLAS_MCP_TENANT_ID：stdio MCP server 跑在操作员宿主机，不在本容器。
      ATLAS_ENABLE_DEMO_MOCK: ${ATLAS_ENABLE_DEMO_MOCK:-}
      ATLAS_ALLOW_VOLATILE_STORAGE: ${ATLAS_ALLOW_VOLATILE_STORAGE:-}
      ATLAS_SECRETS: ${ATLAS_SECRETS:-}
      ATLAS_MASTER_KEY_ID: ${ATLAS_MASTER_KEY_ID:-}
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-}
      ATLAS_PUBLIC_BASE_URL: ${ATLAS_PUBLIC_BASE_URL:-}
      ATLAS_METRICS_TOKEN: ${ATLAS_METRICS_TOKEN:-}
      ATLAS_A2A_TASK_TOKEN: ${ATLAS_A2A_TASK_TOKEN:-}
      ATLAS_OAUTH_REDIRECT_URI: ${ATLAS_OAUTH_REDIRECT_URI:-}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-}
      ATLAS_SCHEDULE_ENABLED: ${ATLAS_SCHEDULE_ENABLED:-}
      ATLAS_SCHEDULE_TICK_SECONDS: ${ATLAS_SCHEDULE_TICK_SECONDS:-}
      ATLAS_SESSION_TTL_HOURS: ${ATLAS_SESSION_TTL_HOURS:-}
      ATLAS_AUDIT_RING: ${ATLAS_AUDIT_RING:-}
      ATLAS_RETENTION_DAYS: ${ATLAS_RETENTION_DAYS:-}
      ATLAS_RETENTION_RUNS_DAYS: ${ATLAS_RETENTION_RUNS_DAYS:-}
      ATLAS_RETENTION_AUDIT_DAYS: ${ATLAS_RETENTION_AUDIT_DAYS:-}
      ATLAS_RETENTION_WEBHOOK_DELIVERIES_DAYS: ${ATLAS_RETENTION_WEBHOOK_DELIVERIES_DAYS:-}
      ATLAS_RETENTION_INTERRUPTIONS_DAYS: ${ATLAS_RETENTION_INTERRUPTIONS_DAYS:-}
      ATLAS_RETENTION_MESSAGE_DELIVERIES_DAYS: ${ATLAS_RETENTION_MESSAGE_DELIVERIES_DAYS:-}
      ATLAS_RETENTION_GRAPH_VERSIONS_DAYS: ${ATLAS_RETENTION_GRAPH_VERSIONS_DAYS:-}
      ATLAS_RETENTION_OPENAPI_IMPORTS_DAYS: ${ATLAS_RETENTION_OPENAPI_IMPORTS_DAYS:-}
      ATLAS_HTTP_EGRESS_ALLOWLIST: ${ATLAS_HTTP_EGRESS_ALLOWLIST:-}
      ATLAS_HTTPAPI_BASE_URL: ${ATLAS_HTTPAPI_BASE_URL:-}
      ATLAS_HTTPAPI_TOKEN: ${ATLAS_HTTPAPI_TOKEN:-}
      ATLAS_HTTPAPI_HEADERS: ${ATLAS_HTTPAPI_HEADERS:-}
      ATLAS_HTTP_CIRCUIT_FAIL_THRESHOLD: ${ATLAS_HTTP_CIRCUIT_FAIL_THRESHOLD:-}
      ATLAS_HTTP_CIRCUIT_COOLDOWN: ${ATLAS_HTTP_CIRCUIT_COOLDOWN:-}
      ATLAS_HTTP_MAX_ATTEMPTS: ${ATLAS_HTTP_MAX_ATTEMPTS:-}
      ATLAS_HTTP_RETRY_BASE_DELAY: ${ATLAS_HTTP_RETRY_BASE_DELAY:-}
      ATLAS_DATABASE_URL: ${ATLAS_DATABASE_URL:-}
      ATLAS_SHOPIFY_ADMIN_BASE_URL: ${ATLAS_SHOPIFY_ADMIN_BASE_URL:-}
      ATLAS_EMBEDDING_PROVIDER: ${ATLAS_EMBEDDING_PROVIDER:-}
      ATLAS_MIGRATIONS_DIR: ${ATLAS_MIGRATIONS_DIR:-}
      ATLAS_DB_READY_TIMEOUT_SECONDS: ${ATLAS_DB_READY_TIMEOUT_SECONDS:-}
      ATLAS_DB_READY_INTERVAL_SECONDS: ${ATLAS_DB_READY_INTERVAL_SECONDS:-}
      ATLAS_LLM_TIMEOUT_SECONDS: ${ATLAS_LLM_TIMEOUT_SECONDS:-60}
      ATLAS_FRONTEND_DIST: ${ATLAS_FRONTEND_DIST:-frontend/dist}
      # 缺省仍是 dev 语义（种子账号照播）。要按 prod 起：ATLAS_ENV=prod 并同时给出
      # ATLAS_MASTER_KEY／ATLAS_APPROVAL_HMAC_SECRET／ATLAS_ADMIN_BOOTSTRAP_PASSWORD，
      # 任一缺失或过短都会**拒绝启动**（docs/64 J-1a、docs/66 打包 L）。
      ATLAS_ENV: ${ATLAS_ENV:-dev}
      ATLAS_MASTER_KEY: ${ATLAS_MASTER_KEY:-}
      ATLAS_APPROVAL_HMAC_SECRET: ${ATLAS_APPROVAL_HMAC_SECRET:-}
      ATLAS_ADMIN_BOOTSTRAP_PASSWORD: ${ATLAS_ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 就绪探针：PG 档真实 SELECT 1，失败返 503（docs/34 P1）
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # 可选 TLS 反代（--profile edge 才启动）；配置见 deploy/Caddyfile
  caddy:
    image: caddy:2
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      atlas:
        condition: service_started
    restart: unless-stopped

  # 可选可观测栈（--profile observability 才启动）；配置见 deploy/prometheus、deploy/grafana
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      atlas:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      # 生产部署必须通过 .env 覆盖 GRAFANA_ADMIN_PASSWORD（默认值仅供本地演示）
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-atlasadmin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  atlas-pgdata:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
