name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  # push 与 pull_request 事件在 PR 分支上 github.ref 相同（refs/heads/dev），
  # 不加 event 维度时两者互相 cancel：先启动的 push run 会取消 pull_request run，
  # GitHub 对 PR 只计 pull_request 的 check run，导致 PR 永远 UNSTABLE（2026-10-06 #128 实测）。
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits on pull_request events

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # astral-sh/setup-uv 无浮动 v10 主版本 tag（只有 v10.x.y），必须钉全版本号
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install package
        # D79：后端依赖以 uv.lock 为唯一事实源，一律按锁装（docs/14 D79、docs/10 §2）。
        # 禁止回到 pip 抽最新——PR #152 本机/CI 双解漂移（starlette 1.6/1.8，404→405）的根治。
        run: uv sync --locked --extra dev
      - name: Run unit tests
        run: uv run pytest
        # integration-marked tests (PostgreSQL/Chromium/shop platform) opt in via ATLAS_RUN_INTEGRATION and skip by default

  backend-integration:
    name: Backend PG integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_RUN_INTEGRATION: "1"
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install package
        # D79：同 backend job，按 uv.lock 装，与单测 job 同一环境
        run: uv sync --locked --extra dev
      - name: Install Chromium for browser integration
        # 审查发现 #13（docs/125 §3.7，U1390）：playwright>=1.62 已是主依赖，这里只补浏览器
        # 二进制与系统库；tests/test_web_browser_integration.py 的 4 个真实 Chromium 用例
        # （I1 选择器点击 / I2 语义层真实坐标 / I5 缓存短路 / type+observe）随之转实跑，
        # 不再双层 skip 恒不执行。flaky 必须修测试，不得回退静默 skip。
        run: uv run playwright install --with-deps chromium
      - name: Apply migrations
        run: uv run python -m scripts.ops.apply_migrations
      - name: Run PG + browser integration tests
        run: uv run pytest
        # docs/63 S3：生产形态 PG 档必须在 CI 每 PR 实跑（含迁移与 audit seq 断言）

  frontend:
    name: Frontend vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
